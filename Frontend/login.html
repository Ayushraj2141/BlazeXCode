<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Agri-Insight AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="index.html" class="logo-link">
          <h1>Agri-Insight AI</h1>
        </a>
      </div>
    </header>

    <main class="container centered-content">
      <form id="loginForm" class="form-card">
        <h2>Login</h2>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2025 Agri-Insight AI. All rights reserved.</p>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Redirect if already logged in
        if (sessionStorage.getItem("username")) {
          window.location.href = "dashboard.html";
        }

        // Ensure Admin account exists
        let users = JSON.parse(localStorage.getItem("users")) || [];
        if (!users.find((u) => u.username === "Admin")) {
          users.push({
            username: "Admin",
            email: "admin@agri.ai",
            password: "Admin",
          });
          localStorage.setItem("users", JSON.stringify(users));
        }

        document
          .getElementById("loginForm")
          .addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            users = JSON.parse(localStorage.getItem("users")) || [];

            const foundUser = users.find(
              (u) =>
                u.username.toLowerCase() === username.toLowerCase() &&
                u.password === password
            );

            if (foundUser) {
              sessionStorage.setItem("username", foundUser.username);
              window.location.href = "dashboard.html";
            } else {
              alert("Invalid username or password.");
            }
          });
      });
    </script>
  </body>
</html>
